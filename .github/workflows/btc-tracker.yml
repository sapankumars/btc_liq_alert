name: BTC liquidation alert

on:
  schedule:
    - cron: "0 */3 * * *"   # a new run is queued every 3h
  workflow_dispatch:

# Only one run at a time. A queued run waits for the current one to finish,
# so the listener restarts back-to-back with almost no gap.
concurrency:
  group: btc-liq
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 358          # GitHub's hard limit is 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install websockets

      - name: Listen for liquidations
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"   # live logs (otherwise output shows only at exit)
          THRESH_60: "500000"     # alert if >= $500K same-side liquidations in 60s
          THRESH_300: "1500000"   # ...or >= $1.5M in 300s
          COOLDOWN: "180"
          RUN_SECONDS: "21000"    # 5h50m, then exit so the queued run takes over
          MAX_FAILS: "6"          # Telegram warning after 6 failed connects in a row
          ENABLE_BYBIT: "1"
          ENABLE_OKX: "1"
          PRICE_ALERT: "1"        # backup alert on fast price moves
          PRICE_PCT_5M: "1.5"
          PRICE_PCT_15M: "2.5"
        run: python btc_liq_alert.py
